# 发布链路（2026-09-03 参考 life-os 实证改造）
#
# Pages 的 Source = Deploy from a branch: gh-pages /(root)。
# 本 workflow 在 master 每次 push 后：校验 → 构建 → 把 dist/ 推到 gh-pages 分支，
# 真正的发布由 GitHub 内置的 "pages build and deployment" 完成。
# 判据：Actions 列表里出现内置的 pages build and deployment 且成功 ⇒ 线上已更新。
#
# 之前走 upload-pages-artifact + deploy-pages（Source=GitHub Actions）连败三次：
# 站点不存在时 deploy-pages 直接失败，configure-pages enablement 也因 GITHUB_TOKEN 无权而失败。
# gh-pages 分支对 Settings 的依赖最小，本地 `npm run deploy:pages` 与 CI 走同一脚本，不会漂。

name: Build & publish to gh-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 推 gh-pages 分支

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 网页版发布用不到 Electron 二进制（100MB+），跳过下载，CI 快一半
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # 隐私守卫：命中供应商实名 / 真人姓名 / 客户品牌词即失败，宁可发布不了也不泄露
      - run: npm run guard
      - run: npm test
      - run: npm run deploy:pages
