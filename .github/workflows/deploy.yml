name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 尝试自动创建/配置 Pages 站点（仓库若未开 Pages，GITHUB_TOKEN 权限够时可直接开）
      # GITHUB_TOKEN 无权自动开站（2026-09-03 实测失败），Pages 需在仓库 Settings → Pages 手动启用；此步失败不阻塞
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 隐私守卫：命中供应商实名 / 真人姓名 / 客户品牌词即失败，宁可发布不了也不泄露
      - run: npm run guard
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
